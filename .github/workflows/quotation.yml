name: Quotation POC

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      requirements_json:
        description: 'Optional requirements JSON; leave blank to use examples/requirements.json'
        required: false
        type: string

permissions:
  contents: read

jobs:
  quotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install -r requirements.txt
      - name: Check calculations, PDF generation and email handling
        run: python -m unittest discover -s tests -v
      - name: Generate and email quotation
        if: github.event_name == 'workflow_dispatch'
        env:
          QUOTATION_REQUIREMENTS_JSON: ${{ inputs.requirements_json }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          QUOTE_EMAIL_TO: ${{ secrets.QUOTE_EMAIL_TO }}
        run: python quotation.py --send-email
      - name: Remove generated PDFs
        if: always()
        run: rm -rf output/pdf
