name: Quotation POC

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      requirements_file:
        description: 'Client workbook path in this branch'
        required: true
        default: examples/client_requirements.xlsx
        type: string
      catalogue_file:
        description: 'Master catalogue workbook path in this branch'
        required: true
        default: data/master_catalogue.xlsx
        type: string
      recipients:
        description: 'Recipient aliases (addresses are stored in the private configuration file)'
        required: true
        type: choice
        default: office
        options:
          - office
          - accounts
          - owner
          - office,accounts
          - office,owner
          - accounts,owner
          - office,accounts,owner

permissions:
  contents: read

jobs:
  quotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install -r requirements.txt
      - name: Check calculations, PDF generation and email handling
        run: python -m unittest discover -s tests -v
      - name: Generate and email quotation
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          CATALOGUE_FILE: ${{ inputs.catalogue_file }}
          QUOTE_RECIPIENT_ALIASES: ${{ inputs.recipients }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python quotation.py --requirements "$REQUIREMENTS_FILE" --catalogue "$CATALOGUE_FILE" --send-email
      - name: Remove generated PDFs
        if: always()
        run: rm -rf output/pdf
