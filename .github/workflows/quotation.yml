name: Quotation POC

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      requirements_file:
        description: 'Client workbook path in OneDrive (not a sharing link)'
        required: true
        default: Quotations/client_requirements.xlsx
        type: string
      catalogue_file:
        description: 'Master catalogue workbook path in OneDrive (not a sharing link)'
        required: true
        default: Quotations/master_catalogue.xlsx
        type: string
      send_partner_1:
        description: 'Send to Partner 1'
        required: true
        type: boolean
        default: true
      send_partner_2:
        description: 'Send to Partner 2'
        required: true
        type: boolean
        default: false
      send_partner_3:
        description: 'Send to Partner 3'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require at least one receiver
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.send_partner_1 && !inputs.send_partner_2 && !inputs.send_partner_3 }}
        run: |
          echo "::error::Select at least one partner to receive the quotation."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check calculations, PDF generation and email handling
        run: python -m unittest discover -s tests -v
      - name: Generate and email quotation
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          CATALOGUE_FILE: ${{ inputs.catalogue_file }}
          SEND_PARTNER_1: ${{ inputs.send_partner_1 }}
          SEND_PARTNER_2: ${{ inputs.send_partner_2 }}
          SEND_PARTNER_3: ${{ inputs.send_partner_3 }}
          PARTNER_1_EMAIL: ${{ secrets.PARTNER_1_EMAIL }}
          PARTNER_2_EMAIL: ${{ secrets.PARTNER_2_EMAIL }}
          PARTNER_3_EMAIL: ${{ secrets.PARTNER_3_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python quotation.py --onedrive --requirements "$REQUIREMENTS_FILE" --catalogue "$CATALOGUE_FILE" --send-email
      - name: Remove generated PDFs
        if: always()
        run: rm -rf output/pdf
